[project]
name = "dj-library-tools"
version = "0.1.0"
description = "Cross-platform CLI to manage a Master DJ music library and sync to Serato/Rekordbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
